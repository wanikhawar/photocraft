# SCRATCH ONLY — temporary visual-evidence probe for #7487. Do not include in the feature PR.
# Base feature commit: 5d9fa9f0ebcd64a1eb6e7f553f5f0f0a9406e2ce
#
# This file selects only the clipped-preview bench. `--visual-evidence` embeds three PNGs per
# selection case (original CPU composite, production layer preview on the real GPU compositor,
# destructive command at k = 1 on the CPU) in `target/perf/interactive_bench.json` under
# `visual_evidence`. The existing perf workflow uploads `target/perf/*.json`, so the lead can
# write the existing PNG bytes to disk without a workflow change. Correctness/visual evidence
# is the purpose; any timings here are incidental and make no new claims.
[[bench]]
name = "interactive_bench"
package = "photocraft-ui-egui"
args = ["--only", "clipped", "--reps", "1", "--size", "512x384", "--visual-evidence"]
quick_args = ["--only", "clipped", "--reps", "1", "--size", "512x384", "--visual-evidence"]
note = "Scratch visual evidence for #7487: clipped raster Curves preview, original/GPU preview/committed PNGs"
