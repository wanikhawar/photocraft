name: Spot ink probe (scratch only)
on:
  push:
    branches: [ci/spot-ink-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        uses: storytold/craft-common-actions/actions/install-apt-packages@main
        with:
          packages: >-
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
            libgtk-3-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          shared-key: ${{ hashFiles('Cargo.toml') }}-gate
          save-if: false
      - name: Fetch the Photoshop-authored spot PSD (psd-tools, pinned)
        run: |
          mkdir -p corpus/psd-tools
          curl -fsSL -A Photocraft-dev -o corpus/psd-tools/cmyk-alpha-spot.psd \
            https://raw.githubusercontent.com/psd-tools/psd-tools/96eb134c17b2c65edf4c4151c0f00b802ada86c2/tests/psd_files/cmyk-alpha-spot.psd
          sha256sum corpus/psd-tools/cmyk-alpha-spot.psd
      - name: Probe
        run: cargo test -p photocraft-ui-egui --test spot_ink_probe -- --nocapture --test-threads=1
