name: PR 10897 PSD memory evidence (verification only)
on:
  workflow_dispatch: null
  push:
    branches:
    - verify/pr10897-evidence*
permissions:
  contents: read
jobs:
  gate:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      packages: libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev
        libgl1-mesa-dev libgtk-3-dev libvulkan1 mesa-vulkan-drivers
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      env: 'PHOTOCRAFT_PSD_MEMORY_EVIDENCE=target/psd-memory-evidence

        PHOTOCRAFT_NO_PRINT=1

        LPDEST=photocraft-no-such-printer

        WGPU_BACKEND=vulkan

        '
      timeout-minutes: 120
      command: "set -euo pipefail\ncargo build --locked -p photocraft\ncargo test\
        \ --locked -p photocraft-ui-egui --lib psd_memory_evidence -- --ignored --nocapture\
        \ --test-threads=1\nls -l \"$PHOTOCRAFT_PSD_MEMORY_EVIDENCE\"\npython3 - <<'PYPNG'\n\
        import base64, pathlib\nfor p in sorted(pathlib.Path('target/psd-memory-evidence').glob('*.png')):\n\
        \    print('PNG_BEGIN ' + p.name)\n    data = base64.b64encode(p.read_bytes()).decode()\n\
        \    for start in range(0, len(data), 1000):\n        print('PNG_DATA ' +\
        \ data[start:start+1000])\n    print('PNG_END ' + p.name)\nPYPNG\n"
