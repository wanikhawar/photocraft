name: PSD write oracle one-off
on:
  push:
    branches: [ci/psd-write-oracle-6130-e2e]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      PHOTOCRAFT_NO_PRINT: "1"
      LPDEST: photocraft-no-such-printer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ca243ba7b31256d278d4a837230eb678783444c1
          persist-credentials: false
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = ca243ba7b31256d278d4a837230eb678783444c1
      - name: Install Linux build dependencies
        uses: storytold/craft-common-actions/actions/install-apt-packages@main
        with:
          packages: >-
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: corpus
          save-if: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: corpus/
          key: corpus-${{ hashFiles('xtask/src/corpus_pins.rs', 'xtask/*.sha256') }}
      - name: Fetch pinned Photoshop corpus
        run: cargo xtask corpus --photoshop
      - name: Build headless CLI
        run: cargo build --locked --release -p photocraft-cli
      - name: Run starter recipes
        run: cargo xtask psd-write-oracle xtask/psd-write-oracle/starter.json corpus/photoshop target/release/photocraft-cli target/psd-write-oracle
      - name: Print report
        if: always()
        run: |
          if [ -f target/psd-write-oracle/report.json ]; then cat target/psd-write-oracle/report.json; fi
      - name: Upload oracle output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: psd-write-oracle-ca243ba7
          path: target/psd-write-oracle/
          if-no-files-found: warn
          retention-days: 14
