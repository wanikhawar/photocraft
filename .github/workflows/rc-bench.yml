name: RC benchmarks

# Fork only, not for upstream. Runs the benchmark examples that an RC's PRs ship, at the RC and at
# the storytold main it was cut from, on one runner in one job, so before and after are measured
# on the same machine. A benchmark the base doesn't have is copied over from the RC (PRs usually
# add the example that measures them). Lines starting with `rc:` run on the RC only, for a
# benchmark that compares both paths itself or needs an API only the RC has.
#
# Absolute times depend on the runner (4 vCPU on a free one); the before/after ratio and the output
# hashes are what to compare with a PR's claims.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "RC branch, tag or SHA, e.g. rc/perf-1"
        required: true
        type: string
      base:
        description: "Base commit (empty: where ref branched from storytold main)"
        type: string
        default: ""
      benches:
        description: "One per line: <package> <example> [args...]; prefix rc: for RC only"
        required: true
        type: string

run-name: RC benchmarks of ${{ inputs.ref }}

permissions:
  contents: read

jobs:
  bench:
    name: before / after
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: rc
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the base
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          cd rc
          git fetch -q https://github.com/storytold/photocraft.git main
          base=${BASE:-$(git merge-base HEAD FETCH_HEAD)}
          git worktree add -q --detach ../base "$base"
          echo "BASE_SHA=$(git rev-parse "$base")" >> "$GITHUB_ENV"
          echo "RC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: storytold/craft-common-actions/actions/install-linux-deps@main
        with:
          deb-arch: amd64
          nfpm-version: "2.47.0"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rc-bench
          workspaces: |
            rc -> target
            base -> target
      - name: Build
        env:
          BENCHES: ${{ inputs.benches }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BENCHES" | sed 's/\r$//' | grep -v '^[[:space:]]*$' > benches.txt
          while read -r first rest; do
            only_rc=0
            if [ "$first" = "rc:" ]; then only_rc=1; read -r first rest <<< "$rest"; fi
            pkg=$first; ex=${rest%% *}
            trees=(rc); [ $only_rc = 1 ] || trees+=(base)
            for t in "${trees[@]}"; do
              if [ "$t" = base ] && ! ls base/crates/*/examples/"$ex".rs >/dev/null 2>&1; then
                src=$(ls rc/crates/*/examples/"$ex".rs)
                mkdir -p "base/$(dirname "${src#rc/}")"
                cp "$src" "base/${src#rc/}"
                echo "$ex: copied from the RC into the base" | tee -a copied.txt
              fi
              echo "::group::$t: $pkg --example $ex"
              (cd "$t" && cargo build --release -p "$pkg" --example "$ex")
              echo "::endgroup::"
            done
          done < benches.txt
      - name: Run
        run: |
          set -uo pipefail
          out=results.md
          {
            echo "## RC benchmarks"
            echo
            echo "- RC: \`${RC_SHA:0:9}\` (${{ inputs.ref }})"
            echo "- Base: \`${BASE_SHA:0:9}\`"
            echo "- Runner: $(nproc) vCPU, $(free -g | awk '/Mem:/{print $2}') GB, $(lscpu | sed -n 's/^Model name: *//p')"
            [ -f copied.txt ] && sed 's/^/- /' copied.txt
          } > "$out"
          status=0
          while read -r first rest; do
            only_rc=0
            if [ "$first" = "rc:" ]; then only_rc=1; read -r first rest <<< "$rest"; fi
            ex=${rest%% *}; args=${rest#"$ex"}
            trees=(base rc); [ $only_rc = 1 ] && trees=(rc)
            printf '\n### %s%s\n' "$ex" "$args" >> "$out"
            for t in "${trees[@]}"; do
              bin="$t/target/release/examples/$ex"
              printf '\n**%s**\n```\n' "$t" >> "$out"
              # shellcheck disable=SC2086
              "$bin" $args >> "$out" 2>&1 || { echo "(exit $?)" >> "$out"; status=1; }
              printf '```\n' >> "$out"
            done
          done < benches.txt
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          cat "$out"
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rc-bench-results
          path: results.md
          if-no-files-found: ignore
